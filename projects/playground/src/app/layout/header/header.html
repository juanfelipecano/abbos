<header class="bar">
    @if (isMobile()) {
        <button app-icon-button type="button" aria-label="Open navigation" (click)="menu.emit()">
            <svg lucideMenu [size]="20" aria-hidden="true"></svg>
        </button>
    }

    <app-logo><span class="chip">UI</span></app-logo>

    @if (!isMobile()) {
        <nav class="nav" aria-label="Main">
            <a
                routerLink="/"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                >Docs</a
            >
            @for (link of links; track link.path) {
                <a
                    [routerLink]="link.path"
                    routerLinkActive="active"
                    ariaCurrentWhenActive="page"
                    >{{ link.label }}</a
                >
            }
            <a [href]="site.releases" target="_blank" rel="noopener">Changelog</a>
        </nav>
    }

    <span class="spacer"></span>

    @if (isMobile()) {
        <button app-icon-button type="button" aria-label="Search docs" (click)="search.open()">
            <svg lucideSearch [size]="18" aria-hidden="true"></svg>
        </button>
    } @else {
        <button
            type="button"
            class="search"
            aria-keyshortcuts="Meta+K Control+K"
            (click)="search.open()"
        >
            <svg lucideSearch [size]="16" aria-hidden="true"></svg>
            <span class="search-text">Search docs…</span>
            <kbd aria-hidden="true">{{ shortcut }}</kbd>
        </button>
        <app-version-menu />
        <a
            app-icon-button
            [href]="site.repo"
            target="_blank"
            rel="noopener"
            aria-label="Abbos on GitHub"
        >
            <app-github-mark [size]="18" />
        </a>
    }

    <button
        app-icon-button
        type="button"
        [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="toggleTheme()"
    >
        @if (isDark()) {
            <svg lucideSun [size]="18" aria-hidden="true"></svg>
        } @else {
            <svg lucideMoon [size]="18" aria-hidden="true"></svg>
        }
    </button>
</header>
